# render.yaml — Render Blueprint for one-click deploy
# Push this repo to GitHub, then go to https://dashboard.render.com/blueprints
# and connect your repo. Render will create all three services automatically.

services:
  # ── Backend API ──
  - type: web
    name: contract-manager-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contract-manager-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://contract-manager.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.7"
    healthCheckPath: /api/health

  # ── Frontend ──
  - type: web
    name: contract-manager
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://contract-manager-api.onrender.com

databases:
  # ── PostgreSQL ──
  - name: contract-manager-db
    plan: free
    databaseName: contract_manager
    postgresMajorVersion: "16"
